name: Bug Report
description: Report a problem with the Puffer Card
body:
  - type: markdown
    attributes:
      value: |
        ## Before you continue

        A screenshot and your card configuration are essential to diagnose rendering problems.

        **Note:** attachments sent via email reply to a GitHub issue notification are automatically stripped and deleted by GitHub — they will not reach this issue. Please attach files directly on github.com instead.

  - type: checkboxes
    id: confirm-scope
    attributes:
      label: Confirm this issue belongs here
      options:
        - label: >-
            I am aware that giorgioparri is a grumpy maintainer, so it can happen that
            my issue will be closed quickly when essential information is missing
            (no screenshot, no card config, no description, etc.).
          required: true
        - label: My Home Assistant version is up to date.
          required: true
        - label: >-
            I have checked, via HACS' 3-dot menu → "Update Information" on this
            card, that I am running the **latest** released version.
          required: true
        - label: I have read the card's README before opening this issue.
          required: true
        - label: >-
            I have checked existing issues (including closed ones) to make sure
            this isn't a duplicate.
          required: true
        - label: >-
            I confirm this is genuinely an issue with the card (not just a
            question about how a feature works).
          required: true
        - label: |
            I confirm that I did not actually read any of the points above and just checked them all. |
            I didn't want to waste time on details, so I skipped reading or following any existing instructions. |
            Instead, I'd like giorgioparri to spend their free time explaining things to me — that's what open source is for, right? |
            I live by the motto: better to ask twice than think once. |
            It's giorgioparri's own fault for offering open-source software and free support.

  - type: input
    id: card_version
    attributes:
      label: Card version
      description: Shown in the browser console on load, or found in CHANGELOG.md.
      placeholder: "e.g. 1.3.0"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Found in Settings → About.
      placeholder: "e.g. 2026.7.1"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: How did you install the card?
      options:
        - HACS
        - Manual (resource added by hand)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Which browser and platform? Rendering bugs are often browser-specific.
      placeholder: "e.g. Firefox 128 on Linux, Safari on iOS"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly. What did you expect, what happened instead?
    validations:
      required: true

  - type: textarea
    id: card_config
    attributes:
      label: Card configuration (YAML)
      description: The full YAML of the card from the dashboard, with entity names anonymized if needed.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: Open the browser developer tools (F12) → Console tab, reproduce the issue, and paste any errors here.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag and drop a screenshot showing the problem. For rendering issues this is the single most useful thing you can provide.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else relevant — other custom cards, theme in use, etc.
    validations:
      required: false